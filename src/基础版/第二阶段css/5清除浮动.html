<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      .top {
        width: 500px;
        /* height: 300px; */
        background-color: pink;
        margin: 0 auto;
      }
      .left {
        float: left;
        width: 100px;
        height: 300px;
        background-color: slateblue;
      }
      .right {
        float: right;
        width: 380px;
        height: 300px;
        background-color: skyblue;
      }
      .bottom {
        height: 100px;
        background-color: brown;
      }
      /* // 通过单伪元素清除浮动 */
      /* .clear::after {
        content: '';
        display: block;
        clear: both;
      } */
      /* .clear {
        clear: both;
      } */
      .clearfix::before,
      .clearfix::after {
        content: '';
        display: table;
        clear: both;
      }
      .clearfix::after {
        clear: both;
      }
    </style>
  </head>
  <body>
    <div class="top clearfix">
      <div class="left"></div>
      <div class="right"></div>
      <!-- <div class="clear"></div> -->
    </div>
    <div class="bottom"></div>
  </body>
</html>
