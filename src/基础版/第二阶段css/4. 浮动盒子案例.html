<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        padding: 0;
        margin: 0;
      }
      li {
        list-style: none;
      }
      .box {
        width: 1000px;
        height: 500px;
        margin: 50px auto;
        background-color: pink;
      }
      .left {
        float: left;
        width: 200px;
        height: 100%;
        background-color: aquamarine;
      }
      .right {
        float: left;
        width: 800px;
        height: 100%;
        background-color: blue;
      }
      .right li {
        float: left;
        width: 150px;
        height: 245px;
        margin: 0px 5px 5px 0px;
        background-color: blueviolet;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="left"></div>
      <div class="right">
        <ul>
          <li>1</li>
          <li>2</li>
          <li>3</li>
          <li>4</li>
          <li>5</li>
          <li>6</li>
          <li>7</li>
          <li>8</li>
        </ul>
      </div>
    </div>
  </body>
</html>
