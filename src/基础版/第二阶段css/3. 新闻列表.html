<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      a {
        text-decoration: none;
      }
      li {
        list-style: none;
      }
      .box {
        width: 300px;
        height: 300px;
        margin: 0 auto;
      }
      .top {
        width: 100%;
        background-color: #eee;
        height: 34px;
        border: 1px solid #dbeee1;
        border-left: none;
      }
      .top a {
        width: 50px;
        height: 34px;
        font-size: 14px;
        color: #333;
        line-height: 32px;
        border-top: 2px solid gold;
        background-color: #fff;
        display: block;
        margin-top: -1px;
        border-right: 1px solid dbeee1;
        text-align: center;
      }
      .list {
        padding: 5px;
        background-color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="top">
        <a href="">新闻</a>
      </div>
      <div class="list">
        <ul>
          <li><a href="">1111111111111111111111</a></li>
          <li><a href="">2222222222222222222222</a></li>
          <li><a href="">3333333333333333333333</a></li>
          <li><a href="">4444444444444444444444</a></li>
          <li><a href="">5555555555555555555555</a></li>
        </ul>
      </div>
    </div>
  </body>
</html>
